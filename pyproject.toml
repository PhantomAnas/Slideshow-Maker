[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slideshow-maker"
version = "0.1.0"
description = "Turn a folder of images or a list of image URLs into polished slideshow videos: Ken Burns motion, transitions, blurred fill, logo, end card and music."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anas (PhantomAnas)" }]
keywords = ["slideshow", "video", "ffmpeg", "ken-burns", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "Pillow>=10",
    "platformdirs>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/PhantomAnas/slideshow-maker"
Issues = "https://github.com/PhantomAnas/slideshow-maker/issues"

[project.scripts]
slideshow-maker = "slideshow_maker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slideshow_maker = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
